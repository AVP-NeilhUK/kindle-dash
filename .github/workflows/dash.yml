name: Render dashboard
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    paths: [fuel.json]   # every fuel upload from the PC also refreshes the dashboard
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow requests
      - name: Get Inter font
        run: mkdir -p fonts && curl -sSfL -o fonts/Inter.ttf "https://raw.githubusercontent.com/google/fonts/main/ofl/inter/Inter%5Bopsz,wght%5D.ttf" || true
      - run: python render.py
        env:
          TOMTOM_KEY: ${{ secrets.TOMTOM_KEY }}
          RAIL_KEY: ${{ secrets.RAIL_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
      - uses: actions/deploy-pages@v4
      # GitHub switches off scheduled jobs after 60 days without a commit.
      # This makes an empty commit every 30 days so that never happens.
      - name: Keep schedule alive
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt 2592000 ]; then
            git config user.name "kindle-dash-bot"
            git config user.email "actions@users.noreply.github.com"
            git commit --allow-empty -m "keepalive"
            git push
          fi
